name: Update journal data

on:
  schedule:
    - cron: "17 8 * * *"   # daily, about 3-4 AM Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Letterboxd, Hardcover and Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: python scripts/fetch_data.py

      # Runs even if one source failed, so the others still get saved.
      - name: Save changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update journal data"
            git push
          fi
